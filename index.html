<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Inter:wght@400;600&family=Hind+Siliguri:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0708;--bg2:#150c0e;--fg:#f6eeee;--mut:#a99d9f;--red:#e11d2e;--red2:#ff5a66;--line:#2b1c1f;--kh:#b9703f;--H:clamp(560px,calc(100vh - 60px),900px);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.6 Inter,"Noto Sans Bengali",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(10,7,8,.9);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:rgba(10,7,8,.9);backdrop-filter:blur(8px)}
.logo{font:400 24px Anton,Impact,sans-serif;letter-spacing:.06em}.logo i{color:var(--red);font-style:normal}
nav{display:flex;gap:20px;font-size:14px}nav a{color:var(--mut);text-decoration:none}nav a:hover{color:var(--fg)}
section{padding:90px 5vw;position:relative}
.h2{font:400 clamp(40px,8vw,96px)/.95 Anton,Impact,sans-serif;text-transform:uppercase}.h2 em{color:var(--red);font-style:normal}
.eb{color:var(--red2);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.hero{height:var(--H);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding-top:40px}.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 55% at 50% 65%,rgba(225,29,46,.28),transparent 70%);pointer-events:none}
.big{position:absolute;left:50%;top:calc(var(--H)*.04);transform:translateX(-50%);font:400 min(calc(var(--H)*.43),22vw)/1 Anton,Impact,sans-serif;color:var(--red);white-space:nowrap;letter-spacing:-.02em;user-select:none}
.photo{position:absolute;left:50%;bottom:calc(var(--H)*-.04);transform:translateX(-50%);height:calc(var(--H)*1.22);width:auto;max-width:none;object-fit:contain;filter:none;-webkit-mask-image:none;mask-image:none}
.ht{position:relative;z-index:2;max-width:clamp(280px,24vw,420px)}
.hi{font:600 clamp(28px,4vw,44px) Caveat,cursive;color:var(--fg)}
.ht h1{font:400 clamp(34px,5.5vw,70px)/1 Anton,Impact,sans-serif;text-transform:uppercase;margin:4px 0 14px}
.rl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.rl span{border:1px solid var(--red);color:var(--red2);padding:3px 12px;border-radius:99px;font-size:13px}
.ht p{color:var(--kh);margin-bottom:20px;text-shadow:0 0 12px var(--bg)}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;padding:12px 22px;font-weight:600}.btn:hover{background:var(--red2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:40px}
.card{aspect-ratio:16/10;background:linear-gradient(135deg,#2a0d12,#0f0709) center/cover;border:1px solid var(--line);display:flex;align-items:flex-end;padding:16px;transition:.3s}
.card:hover{border-color:var(--red);transform:translateY(-4px)}
.card small{color:var(--red2)}.card h3{font:400 24px Anton,Impact,sans-serif;text-transform:uppercase;text-shadow:0 2px 12px #000}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:22px 0;margin-bottom:60px}
.mq div{display:flex;gap:60px;width:max-content;animation:mq 25s linear infinite}
.mq span{font:400 28px Anton,Impact,sans-serif;color:var(--mut);text-transform:uppercase;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.stat{font:400 clamp(70px,12vw,150px)/1 Anton,Impact,sans-serif;color:var(--red);margin-top:24px}
.row{display:flex;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.row b{display:block;font-size:18px}.row span{color:var(--mut);font-size:14px}.row em{font:400 28px Anton,Impact,sans-serif;color:var(--red);font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.chips span{background:var(--bg2);border:1px solid var(--line);padding:6px 16px;border-radius:99px;font-size:14px}
.ct a{display:block;color:var(--fg);text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line)}.ct a small{display:block;color:var(--red2);font-size:12px;letter-spacing:.15em;text-transform:uppercase}.ct a:hover{color:var(--red2)}
footer{padding:30px 5vw 120px;color:var(--mut);font-size:13px;border-top:1px solid var(--line)}
.js .bx{opacity:0;translate:0 16px;transition:opacity .5s,translate .5s,border-color .3s,transform .3s}.js .bx.built{opacity:1;translate:none}
.cur{position:fixed;left:0;top:0;z-index:55;pointer-events:none;transition:transform .42s cubic-bezier(.22,.8,.25,1),opacity .35s}
.cur svg{filter:drop-shadow(0 2px 5px rgba(0,0,0,.65));animation:cursorFloat 1.1s ease-in-out infinite alternate}
.cur b{display:inline-flex;align-items:center;gap:4px;font:700 10px Inter,sans-serif;letter-spacing:.04em;color:#fff;padding:4px 8px;border:1px solid currentColor;border-radius:7px;margin-left:4px;vertical-align:top;box-shadow:0 3px 12px #0008}
.agent-frame{position:fixed;z-index:49;pointer-events:none;border:1.5px solid var(--agent-color,#ff5a66);border-radius:8px;box-shadow:0 0 0 1px #0008,inset 0 0 18px color-mix(in srgb,var(--agent-color,#ff5a66) 12%,transparent),0 0 18px color-mix(in srgb,var(--agent-color,#ff5a66) 28%,transparent);opacity:0;transition:opacity .2s ease}
.agent-frame .frame-tag{position:absolute;left:8px;top:7px;padding:2px 7px;border-radius:4px;background:var(--agent-color,#ff5a66);color:#090607;font:800 9px/1.5 Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;box-shadow:0 2px 8px #0007}
@keyframes frameDraw{0%{clip-path:inset(0 100% 100% 0 round 8px);opacity:0;transform:scale(.985)}55%{opacity:1}100%{clip-path:inset(0 0 0 0 round 8px);opacity:1;transform:scale(1)}}
@keyframes frameVanish{0%{opacity:1;clip-path:inset(0 0 0 0 round 8px);transform:scale(1)}100%{opacity:0;clip-path:inset(0 0 0 0 round 8px);transform:scale(1.018)}}
@keyframes cursorFloat{from{transform:translateY(-1px) rotate(-3deg)}to{transform:translateY(2px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.cur svg{animation:none}.agent-frame.show,.agent-frame.fade{animation:none;opacity:0}}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:40;background:rgba(21,12,14,.95);border:1px solid var(--line);border-radius:99px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;font-size:13px;white-space:nowrap;max-width:94vw}
#bar button{background:var(--red);color:#fff;border:0;border-radius:99px;padding:6px 14px;font:600 13px Inter,sans-serif;cursor:pointer;display:none}
.lg{display:flex;gap:4px}.lg button{background:none;border:1px solid var(--line);color:var(--mut);padding:4px 10px;border-radius:99px;font:600 12px Inter,"Noto Sans Bengali",sans-serif;cursor:pointer}.lg .on{background:var(--red);border-color:var(--red);color:#fff}
html[lang="bn"] :is(.h2,.ht h1,.card h3,.hi,.mq span){font-family:"Noto Sans Bengali",sans-serif;font-weight:700;text-transform:none;letter-spacing:0}
x-t{display:inline}nav a.on{color:var(--fg)}
main#pg{padding:70px 5vw 90px;min-height:70vh}
.pg-t{font:400 clamp(44px,9vw,110px)/1 Anton,Impact,sans-serif;text-transform:uppercase}
.pg-i{color:var(--mut);max-width:680px;margin:14px 0}
.sub{position:relative;margin-top:50px}.sub h3{font:400 clamp(26px,4vw,42px) Anton,Impact,sans-serif;color:var(--red);text-transform:uppercase}
.row p.d{color:var(--mut);font-size:14px;margin-top:4px}
.row,.card,.chips span,.mq span,.rl span,.ct a{position:relative}
.xb{position:absolute;top:-8px;right:-8px;z-index:5;width:24px;height:24px;border-radius:99px;border:1px solid var(--red);background:#000;color:#fff;font-size:12px;cursor:pointer;padding:0}
.ab{background:none;border:1px dashed var(--red2);color:var(--red2);padding:8px 16px;border-radius:99px;margin-top:14px;cursor:pointer;font:600 13px Inter,"Noto Sans Bengali",sans-serif}
.editing [data-p]{outline:1px dashed rgba(255,90,102,.55);outline-offset:3px;cursor:text}
.editing [data-p]:empty:before{content:"…";color:var(--mut)}
.editing [data-img]{outline:2px dashed var(--red2);cursor:pointer}
.js .editing .bx{opacity:1;translate:none}
.editing .mq{overflow:visible}.editing #mq{animation:none;flex-wrap:wrap;width:auto}
.off{display:none}.editing .off{display:block;opacity:.4}
#ep{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:45;display:flex;gap:6px;flex-wrap:wrap;max-width:44vw}
#ep[hidden]{display:none}
#ep button{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:7px 12px;font:600 12px Inter,"Noto Sans Bengali",sans-serif;cursor:pointer}
#ts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 76px);z-index:60;background:var(--red);color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;display:none;max-width:92vw}
@media(max-width:700px){header{flex-wrap:wrap}nav{order:3;width:100%;overflow-x:auto;white-space:nowrap;gap:18px;padding-bottom:4px}#ep{bottom:calc(env(safe-area-inset-bottom,0px) + 74px);max-width:92vw}.two{grid-template-columns:1fr}.photo{height:calc(var(--H)*1.02);bottom:calc(var(--H)*-.015);filter:none;-webkit-mask-image:none;mask-image:none}.ht{max-width:none;margin:0 -5vw;padding:60px 5vw 0;background:linear-gradient(to top,var(--bg) 55%,transparent)}#bar{width:92vw;justify-content:space-between;font-size:11px;white-space:normal;border-radius:18px;padding:6px 6px 6px 14px}.hero{padding-bottom:30px}}

.highlights{padding-top:24px;padding-bottom:40px}
.highlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.highlight{display:flex;flex-direction:column;gap:8px;min-height:150px;padding:20px;border:1px solid var(--line);background:linear-gradient(135deg,#1b0b0e,#0d0809);color:var(--fg);text-decoration:none;transition:.25s}
.highlight:hover{border-color:var(--red);transform:translateY(-4px)}
.highlight span{color:var(--red2);font:400 16px Anton,Impact,sans-serif}
.highlight strong{font:400 clamp(22px,3vw,34px) Anton,Impact,sans-serif;text-transform:uppercase}
.highlight small{color:var(--mut);font-family:"Noto Sans Bengali",sans-serif}
.admin-note{color:var(--mut);font-size:12px;max-width:300px}
@media(max-width:700px){.highlight-grid{grid-template-columns:1fr}.highlight{min-height:105px}}

html[lang="bn"] body,
html[lang="bn"] button,
html[lang="bn"] input,
html[lang="bn"] textarea,
html[lang="bn"] select,
html[lang="bn"] nav,
html[lang="bn"] .admin-note,
html[lang="bn"] .pg-i,
html[lang="bn"] .row,
html[lang="bn"] .sub {
  font-family:"Noto Sans Bengali",Inter,system-ui,sans-serif;
  font-feature-settings:"kern";
}
html[lang="bn"] :is(h1,h2,h3,.highlight strong,.h2,.hi,.mq span) {
  font-family:"Noto Sans Bengali",Inter,sans-serif;
  font-weight:700;
  letter-spacing:0;
  text-transform:none;
}

/* Original centered hero composition; new full portrait stays behind the PORTFOLIO title */
.hero{isolation:isolate}
.big{left:50%;top:calc(var(--H)*.04);transform:translateX(-50%);z-index:2}
.photo{left:50%;right:auto;bottom:calc(var(--H)*-.02);top:auto;transform:translateX(-50%);height:100%;max-height:100%;width:auto;max-width:94vw;object-fit:contain;object-position:center bottom;z-index:1}
.ht{z-index:3}
@media(max-width:700px){
 .photo{height:88%;max-width:100vw;bottom:0}
 .big{top:calc(var(--H)*.04);font-size:min(calc(var(--H)*.34),21vw)}
}


/* Word-like visual editor */
#ep{position:fixed;z-index:100;top:12px;left:50%;bottom:auto;transform:translateX(-50%);width:min(97vw,1180px);max-width:97vw;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 12px;background:rgba(20,13,16,.97);
  border:1px solid #60404a;border-radius:14px;box-shadow:0 12px 40px #000b;backdrop-filter:blur(16px)}
#ep[hidden]{display:none}
#ep button,#ep select,#ep input{font:600 12px Inter,"Noto Sans Bengali",sans-serif;color:#f8eeee;background:#24171c;
  border:1px solid #68434c;border-radius:7px;min-height:32px;padding:5px 9px}
#ep button{cursor:pointer}
#ep button:hover{background:#49202b;border-color:#ff5a66}
#ep .ed-sep{width:1px;height:25px;background:#68434c;margin:0 3px}
#ep .ed-title{font:700 12px Inter,"Noto Sans Bengali",sans-serif;color:#ff8c96;padding:0 5px}
#ep .ed-hint{font:11px Inter,"Noto Sans Bengali",sans-serif;color:#c7b6bb;padding:0 5px}
#ep input[type=color]{width:36px;min-width:36px;padding:2px}
#ep input[type=number]{width:58px}
#ep select{max-width:150px}
.editor-selected{outline:2px solid #ffb703!important;outline-offset:4px!important;position:relative}
body.editing [data-p]{cursor:text}
#editor-file{display:none}
@media(max-width:700px){
 #ep{top:6px;padding:7px;width:98vw;gap:4px;border-radius:10px}
 #ep button,#ep select,#ep input{font-size:11px;min-height:30px;padding:4px 6px}
 #ep .ed-hint{display:none}
 #ep select{max-width:112px}
}


/* Updated hero bio: transparent, clearer, wider and aligned from the right */
.hero .ht{
  align-self:flex-end;
  width:min(49vw,720px);
  max-width:720px;
  margin-left:auto;
  margin-right:0;
  padding:0 0 0 24px;
  text-align:right;
  background:transparent!important;
}
.hero .ht .rl{justify-content:flex-end}
.hero .ht .hi{font-size:clamp(30px,4.2vw,50px);text-shadow:0 2px 14px #000}
.hero .ht h1{font-size:clamp(38px,5.8vw,76px);text-shadow:0 3px 18px #000}
.hero .ht p{
  margin-left:auto;
  max-width:100%;
  color:#fff;
  font-size:clamp(17px,1.55vw,22px);
  line-height:1.65;
  text-shadow:0 2px 5px #000,0 0 14px #000,0 0 24px #000;
  background:transparent!important;
}
.hero .ht .btn{margin-left:auto}
@media(max-width:700px){
  .hero .ht{
    width:100%;
    max-width:none;
    margin:0;
    padding:34px 5vw 0;
    text-align:right;
    background:transparent!important;
  }
  .hero .ht .rl{justify-content:flex-end}
  .hero .ht h1{font-size:clamp(34px,9vw,52px)}
  .hero .ht p{font-size:17px;line-height:1.55}
  .hero .ht .btn{margin-left:auto}
}


/* ===== Desktop hero fix: title, portrait and bio no longer overlap (phone layout <=700px is untouched) ===== */
@media(min-width:701px){
  .hero{
    --T:min(calc(var(--H)*.30),15vw);                      /* PORTFOLIO font size */
    --zc:calc(var(--T)*.834 + 10px);                        /* where the title letters end */
    height:auto;min-height:var(--H);
    justify-content:flex-start;
    padding:10px 5vw 56px;
  }
  .hero .big{position:relative;left:auto;top:auto;transform:none;align-self:center;margin:0;
    font-size:var(--T);line-height:.9;text-align:center;z-index:2;flex:none}
  .hero .photo{left:var(--px);right:auto;top:auto;bottom:0;height:var(--ph);max-height:none;width:auto;max-width:none;
    transform:translateX(-54.3%);z-index:1}
  .hero .ht{margin:auto 0 0 auto;align-self:flex-end;width:var(--tw);max-width:none;padding:18px 0 0;z-index:3}
  .hero .ht .hi{font-size:clamp(28px,2.9vw,46px);line-height:1.1}
  .hero .ht h1{font-size:clamp(34px,3.7vw,58px);line-height:1.02;margin:2px 0 14px}
  .hero .ht .rl{margin-bottom:16px}
  .hero .ht p{font-size:clamp(16px,1.2vw,20px);line-height:1.6;margin-bottom:22px}
  html[lang="bn"] .hero .ht .hi{line-height:1.35}
  html[lang="bn"] .hero .ht h1{line-height:1.3}
}
/* wide screens: portrait centred under the title, bio column in the free space on its right */
@media(min-width:1180px){
  .hero{
    --px:50vw;
    --ph:min(calc((var(--H) - var(--zc))/.845),820px);      /* head starts right under the title */
    --tw:min(640px,calc(45vw - var(--ph)*.24 - 32px));
  }
}
/* narrower windows / tablets: portrait on the left, bio on the right */
@media(min-width:701px) and (max-width:1179px){
  .hero{
    --px:27vw;
    --ph:min(calc((var(--H) - var(--zc))/.845),62vw,820px);
    --tw:calc(68vw - var(--ph)*.24 - 24px);
  }
}

/* status text removed: only the Replay button stays in the bottom bar */
/* bio: full lines, no ragged gap on the left */
.hero .ht p{text-align:justify;text-align-last:right;hyphens:none}

/* name stays on one line */
.hero .ht h1{white-space:nowrap}

/* status bar: blue border on parts of the pill, soft blue touch on the rest */
#bar{
  border:1px solid transparent;
  background:
    radial-gradient(130% 260% at 0% 50%,rgba(112,214,255,.20),transparent 55%) padding-box,
    radial-gradient(90% 220% at 100% 0%,rgba(112,214,255,.09),transparent 60%) padding-box,
    linear-gradient(rgba(21,12,14,.95),rgba(21,12,14,.95)) padding-box,
    linear-gradient(115deg,rgba(112,214,255,.95) 0%,rgba(112,214,255,.12) 38%,rgba(255,255,255,.06) 62%,rgba(112,214,255,.8) 100%) border-box;
  box-shadow:0 8px 26px rgba(0,0,0,.45),0 0 20px rgba(112,214,255,.12);
  color:#e9f7ff;
}
</style>
</head>
<body>
<header><div class="logo" id="logo"></div><nav id="nav"></nav><div class="lg" id="lg"></div></header>

<div id="homev"><section class="hero" id="home">
  <div class="big bx" aria-hidden="true">PORTFOLIO</div>
  <img class="photo bx" id="photo" alt="">
  <div class="ht"><div class="hi bx" id="hi"></div><h1 class="bx" id="nm"></h1><div class="rl bx" id="rl"></div><p class="bx" id="bio"></p><a class="btn bx" href="#works" id="cta"></a></div>
</section>

<section id="highlights" class="highlights"><div class="eb bx">Explore my profile</div><div class="highlight-grid">
<a class="highlight bx" href="#experience"><span>01</span><strong>Experience</strong><small>অভিজ্ঞতা</small></a>
<a class="highlight bx" href="#skills"><span>02</span><strong>Skills</strong><small>দক্ষতা</small></a>
<a class="highlight bx" href="#certificates"><span>03</span><strong>Certificates</strong><small>সনদ</small></a>
</div></section>
<section id="works"><div><div class="eb bx" data-i="eb_work">Selected work</div><h2 class="h2 bx" id="wt"></h2><div class="grid" id="grid"></div></div></section>

<section id="awards"><div class="mq bx"><div id="mq"></div></div>
  <div class="two"><div><div class="eb bx" data-i="eb_awards">Been part of the bigger picture</div><h2 class="h2 bx" id="at"></h2><div class="stat bx" id="stn"></div><div id="stl" class="bx" style="color:var(--mut)"></div></div><div id="aw"></div></div></section>

<section id="about"><div class="two"><div><div class="eb bx" data-i="eb_about">About &amp; skills</div><h2 class="h2 bx" id="ab"></h2><div class="chips" id="sk"></div></div><div id="ed"></div></div></section>

<section id="contact"><div class="two"><div><div class="eb bx" data-i="eb_contact">Your next story</div><h2 class="h2 bx" id="ctt"></h2><p class="bx" style="color:var(--mut);margin-top:18px" id="ctp"></p></div><div class="ct" id="ctl"></div></div></section>

</div><main id="pg" hidden></main><footer id="ft"></footer>

  frame.style.setProperty("--agent-color", c.color);
  frame.querySelector(".frame-tag").textContent = `TURJO ${pool.indexOf(c)+1}`;
  frame.style.transition = "opacity .18s ease";
  frame.style.opacity = scrollOpacity() * .92;
  await wait(210);
  if (!agentsOn) { frame.style.opacity = 0; return; }
  target.classList.add("built"); updateBar();
  await wait(100);
  frame.style.opacity = 0;
  // a quick dash after each block makes the agent look like it is actively building
  hop(c, r.left + (Math.random()-.5)*Math.min(180,innerWidth*.35), r.top + (Math.random()-.5)*Math.min(120,innerHeight*.25));
  await wait(180);
}
async function run(c) {
  if (c.busy || reduce) return;
  c.busy = true; busyN++; updateBar();
  while (agentsOn && queue.length) {
    const target = queue.shift();
    if (!target) continue;
    try { await build(c, target); } finally { target._q = false; }
  }
  c.busy = false; busyN = Math.max(0, busyN - 1); updateBar();
  if (agentsOn && queue.length) run(c);
}
function enqueue(el) {
  if (el._q || el.classList.contains("built")) return;
  el._q = true; queue.push(el);
}
/* blocks that are on screen (or already above it) and have never been built */
function pending() {
  const l = lim();
  return [...homeRoot().querySelectorAll(".bx:not(.built)")].filter(el => {
    const r = el.getBoundingClientRect();
    return (r.width || r.height) && r.top < l;
  });
}
function armSettle() { clearTimeout(idleT); idleT = setTimeout(settle, 650); }
/* wake the agents ONLY if there is something new to build */
function kick() {
  if (reduce) return;
  const p = pending();
  if (!p.length) return;
  p.forEach(enqueue);
  armSettle();
  if (!agentsOn) startAgents();
  pool.filter(c => !c.busy).slice(0, Math.min(queue.length, POOL)).forEach(run);
  updateBar();
}
/* scrolling stopped: agents finish what is in front of them, then go away */
function settle() {
  idleT = 0;
  if (agentsOn && (queue.length || busyN)) { idleT = setTimeout(settle, 300); return; }
  const l = lim();
  // blocks the user flew past (or left half-built by an upward scroll) appear quietly instead of staying blank
  homeRoot().querySelectorAll(".bx:not(.built)").forEach(el => {
    const r = el.getBoundingClientRect();
    if ((r.width || r.height) && r.top < l) el.classList.add("built");
  });
  if (agentsOn) stopAgents();
  updateBar();
}
function reg() {
  document.querySelectorAll(".bx:not(.seen)").forEach(el => {
    el.classList.add("seen");
    if (reduce) { el.classList.add("built"); return; }
    // content re-created (e.g. language switch) inside the area already visited: show it without the agents
    if (maxY > 0 && el.offsetParent !== null && el.getBoundingClientRect().top + scrollY < maxY) el.classList.add("built");
  });
  maxY = Math.max(maxY, scrollY + innerHeight);
}
function updateBar() {
  const root = $("#pg").hidden ? $("#homev") : $("#pg"), all = root.querySelectorAll(".bx").length || 1, n = root.querySelectorAll(".bx.built").length, done = n >= all;
  bt.textContent = T(done ? "built" : busyN ? "build" : "idle").replace("{a}", done ? POOL : busyN || POOL).replace("{n}", n).replace("{t}", all);
  rp.style.display = n ? "inline-block" : "none";
  const txt = bt.textContent;
  bt.style.display = txt ? "" : "none";
  $("#bar").style.display = n ? "flex" : "none";
  $("#bar").style.padding = txt ? "" : "6px";
  $("#bar").style.width = txt ? "" : "auto";
}
let tick = false;
addEventListener("scroll", () => {
  const y = scrollY, dy = y - lastY; lastY = y;
  maxY = Math.max(maxY, y + innerHeight);
  armSettle();
  if (dy < -2) { pauseAgents(); return; }       // going up: agents never work
  if (dy <= 0 || tick) return;                   // only a downward scroll can start them
  tick = true;
  requestAnimationFrame(() => {
    tick = false;
    kick();
    if (agentsOn) { const o = scrollOpacity(); pool.forEach(c => { if (!c.busy) c.el.style.opacity = o; }); }
    updateBar();
  });
}, {passive:true});

rp.onclick = () => {
  queue.length = 0; stopAgents(true);
  document.querySelectorAll(".bx").forEach(el => { el.classList.remove("built", "seen"); el._q = false; });
  scrollTo({top: 0, behavior: "instant"}); lastY = 0; maxY = 0; reg(); updateBar(); kick();
};

/* keep the name on a single line: scale it down only when it is wider than its column */
function fitName() {
  const h = $("#nm"); if (!h) return;
  h.style.transform = "";
  const cw = h.clientWidth; if (!cw) return;
  const rg = document.createRange(); rg.selectNodeContents(h);
  const w = rg.getBoundingClientRect().width;
  if (w > cw + .5) { h.style.transformOrigin = "0 50%"; h.style.transform = `scale(${((cw / w) * .985).toFixed(4)})`; }
}
addEventListener("resize", fitName);
if (document.fonts) { document.fonts.ready.then(fitName); document.fonts.addEventListener("loadingdone", fitName); }
if (window.ResizeObserver) new ResizeObserver(fitName).observe($("#nm"));

const clone = o => JSON.parse(JSON.stringify(o));
function cleanData() {
  if (!DATA || typeof DATA !== "object") DATA = clone(DATA0);
  for (const k in DATA0) if (DATA[k] === undefined || DATA[k] === null) DATA[k] = clone(DATA0[k]);   // missing keys fall back to defaults
  const str = v => typeof v === "string" ? v : "";
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  if (!Array.isArray(DATA.pages)) DATA.pages = [];
  // an untouched old placeholder page is upgraded to the new, richer version
  DATA.pages = DATA.pages.map(pg => { const old = OLD_PAGES.find(o => pg && o.id === pg.id); return old && same(pg, old) ? clone(DATA0.pages.find(x => x.id === pg.id)) : pg; });
  DATA.pages = DATA.pages.map(pg => { const def = pg && DATA0.pages.find(x => x.id === pg.id); return def && !Array.isArray(pg.subs) ? clone(def) : pg; });   // broken built-in page -> default
  DATA.pages = DATA.pages.filter(pg => pg && typeof pg === "object" && typeof pg.id === "string" && pg.id).map(pg => {
    pg.t = str(pg.t) || pg.id; pg.intro = str(pg.intro);
    pg.subs = (Array.isArray(pg.subs) ? pg.subs : []).filter(x => x && typeof x === "object").map(sb => {
      sb.t = str(sb.t); if (sb.d !== undefined) sb.d = str(sb.d);
      sb.items = (Array.isArray(sb.items) ? sb.items : []).filter(x => x && typeof x === "object").map(it => { it.t = str(it.t); it.s = str(it.s); it.y = str(it.y); it.d = str(it.d); return it; });
      return sb;
    });
    return pg;
  });

  DATA0.pages.forEach(def => { if (!DATA.pages.some(x => x.id === def.id)) DATA.pages.push(clone(def)); });

async function bootstrap() {
  try {
